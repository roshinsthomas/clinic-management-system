<!DOCTYPE html>
<html>
<head>
    <title>Consultation Bill</title>
</head>

<body>

    <h2>Consultation Bill</h2>

    <p>
        Patient:
        {{ appointment.patient.first_name }}
        {{ appointment.patient.last_name }}
    </p>

    <p>
        Doctor:
        {{ appointment.doctor.user.get_full_name }}
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Generate Bill</button>
    </form>

</body>
</html>
