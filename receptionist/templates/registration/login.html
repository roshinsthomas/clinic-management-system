<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    {% if form.errors %}
        <p>Username or password is incorrect.</p>
    {% endif %}

</body>
</html>
